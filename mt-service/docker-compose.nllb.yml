# NLLB-200-distilled-1.3B 翻译服务（Meta 的专用翻译模型，不是大模型）。
#
# 这是**日常要用的那一套**：镜像在构建期就用官方流程把
# facebook/nllb-200-distilled-1.3B 转成了 CTranslate2（int8），运行期不联网、不需要 torch。
#
# 实测（CPU，12 核）：
#   600M fp32  单句 2.0~3.8s，长句会丢后半句，数字常翻错（"上午九点三点抵达"）
#   1.3B int8  单句 0.6~1.1s，长句完整，数字正确（"火车7点45分出发,到达9点30分"）
# → 1.3B int8 又快又好，作为默认。
#
# 用法：
#   docker compose -f docker-compose.nllb.yml up -d
#
# 注意：别再用 mt-service/docker-compose.yml（那是轻量 opus 变体，译文质量差，
# 只作为无网环境下的兜底）。镜像已 tag 成本地名字，不需要联网构建。
services:
  mt:
    image: realtime-translation-mt:nllb13b
    container_name: realtime-translation-mt
    ports:
      - "9910:9910"
    environment:
      MT_MODEL_DIR: "/opt/mt-model"
      MT_DEVICE: "cpu"
      # int8：实测与 fp32 质量一致，但快 2~3 倍
      MT_COMPUTE_TYPE: "int8"
      MT_BEAM_SIZE: "4"
      # 切分阈值：超过这个长度才拆开翻。NLLB 对过长的输入会在中途生成结束符，
      # 导致后半句漏译；实测 60 最稳（调到 120 时复合句会整从句丢掉）
      MT_SPLIT_THRESHOLD: "60"
      # 构建期已把 tokenizer 放进镜像，运行时不联网
      MT_HF_TOKENIZER: "/opt/mt-model/tokenizer"
      MT_SOURCE_CODE: "eng_Latn"
      MT_TARGET_CODE: "zho_Hans"
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped
