<!doctype html>
<html>
  <body>
    <script>
      /**
       * 每秒记录音轨状态（muted / readyState / enabled）与实测电平。
       * muted 为 true 时数据速率正常但内容全 0，正是"采集哑掉"的典型症状。
       */
      window.runProbe = async (seconds) => {
        const secs = seconds || 12
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { mandatory: { chromeMediaSource: 'desktop' } },
          video: { mandatory: { chromeMediaSource: 'desktop' } }
        })
        stream.getVideoTracks().forEach((t) => t.stop())
        const track = stream.getAudioTracks()[0]
        const log = []
        track.addEventListener('mute', () => log.push({ event: 'mute' }))
        track.addEventListener('unmute', () => log.push({ event: 'unmute' }))
        track.addEventListener('ended', () => log.push({ event: 'ended' }))

        const ctx = new AudioContext({ sampleRate: 48000 })
        if (ctx.state === 'suspended') await ctx.resume()
        const source = ctx.createMediaStreamSource(stream)
        const gain = ctx.createGain()
        gain.gain.value = 0
        gain.connect(ctx.destination)
        const node = ctx.createScriptProcessor(4096, 1, 1)
        let sum = 0
        let n = 0
        node.onaudioprocess = (e) => {
          const ch = e.inputBuffer.getChannelData(0)
          for (let i = 0; i < ch.length; i++) {
            sum += ch[i] * ch[i]
            n++
          }
        }
        source.connect(node)
        node.connect(gain)

        const rows = []
        for (let s = 0; s < secs; s++) {
          sum = 0
          n = 0
          await new Promise((r) => setTimeout(r, 1000))
          rows.push({
            t: s,
            muted: track.muted,
            readyState: track.readyState,
            enabled: track.enabled,
            rms: n ? Number(Math.sqrt(sum / n).toFixed(5)) : 0,
            samples: n
          })
        }
        stream.getTracks().forEach((t) => t.stop())
        try {
          ctx.close()
        } catch (e) {}
        return { rows, log, settings: track ? track.getSettings() : {} }
      }
    </script>
  </body>
</html>
